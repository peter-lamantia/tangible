name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tangible-linux-x86_64
            binary: tangible
          - os: ubuntu-24.04-arm
            artifact: tangible-linux-arm64
            binary: tangible
          - os: macos-latest
            artifact: tangible-macos-arm64
            binary: tangible
          - os: macos-15-intel
            artifact: tangible-macos-x86_64
            binary: tangible
          - os: windows-latest
            artifact: tangible-windows-x86_64
            binary: tangible.exe
          - os: windows-11-arm
            artifact: tangible-windows-arm64
            binary: tangible.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev
      - name: Build
        run: cargo build --release --locked
      - name: Prepare executable and checksum
        shell: bash
        run: python scripts/package.py "${{ matrix.artifact }}" "target/release/${{ matrix.binary }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}
            ${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="main-${COMMIT}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --target "$COMMIT" --title "Main build ${COMMIT:0:7}" --generate-notes
          fi
