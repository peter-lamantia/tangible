name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tangible-linux-x86_64
            binary: tangible
          - os: macos-latest
            artifact: tangible-macos-arm64
            binary: tangible
          - os: windows-latest
            artifact: tangible-windows-x86_64
            binary: tangible.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libasound2-dev
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir -p "${{ matrix.artifact }}"
          cp "target/release/${{ matrix.binary }}" "${{ matrix.artifact }}/"
          cp README.md "${{ matrix.artifact }}/"
          python -m zipfile -c "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          tag="main-${COMMIT}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.zip --clobber
          else
            gh release create "$tag" artifacts/*.zip --target "$COMMIT" --title "Main build ${COMMIT:0:7}" --generate-notes
          fi
