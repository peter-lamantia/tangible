[package]
name = "tangible"
version = "0.1.0"
edition = "2021"
description = "Tangible — a cross-platform 3D STL viewer"

[dependencies]
wgpu = "0.20"
winit = "0.29"
glam = "0.27"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
rfd = "0.17"
egui = "0.28"
egui-winit = { version = "0.28", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.28", features = ["winit"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
gltf = { version = "1.4.1", features = ["import"] }
ply-rs = "0.1.3"

[profile.release]
lto = "thin"
codegen-units = 1
